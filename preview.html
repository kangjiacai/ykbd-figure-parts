<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>你可能不知道 · 形象预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #E6E8EC;
      color: #111;
      font-family: "WenQuanYi Micro Hei", "Droid Sans Fallback", "Noto Sans CJK SC", sans-serif;
    }
    .page { padding: 18px 16px 48px; }
    .fit { width: 540px; height: 720px; margin: 0 auto; overflow: hidden; }
    .sheet {
      width: 1080px;
      height: 1440px;
      background: #E6E8EC;
      padding: 36px 40px 48px;
      transform: scale(0.5);
      transform-origin: top left;
    }
    .card {
      position: relative;
      width: 100%;
      height: 100%;
      background: #C8F542;
      border: 6px solid #111;
      border-radius: 40px;
      box-shadow: 12px 12px 0 #111;
      overflow: hidden;
    }
    .tag {
      position: absolute;
      left: 36px;
      top: 28px;
      z-index: 3;
      background: #fff;
      border: 4px solid #111;
      border-radius: 999px;
      padding: 8px 22px;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
      box-shadow: 5px 5px 0 #111;
      transform: rotate(-3deg);
    }
    .dot {
      position: absolute;
      right: 64px;
      top: 108px;
      width: 132px;
      height: 132px;
      border: 6px solid #111;
      border-radius: 50%;
      background: #C9B8FF;
      box-shadow: 8px 8px 0 #111;
    }
    .sticker {
      position: absolute;
      left: 18px;
      top: 150px;
      width: 700px;
      height: 1040px;
      background: #fff;
      border: 6px solid #111;
      border-radius: 36px;
      box-shadow: 14px 14px 0 #111;
      transform: rotate(-6deg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .sticker svg { width: 640px; height: 640px; display: block; }
    .name {
      position: absolute;
      right: 28px;
      top: 620px;
      z-index: 3;
      max-width: 360px;
      background: #fff;
      border: 6px solid #111;
      border-radius: 22px;
      padding: 16px 20px;
      box-shadow: 8px 8px 0 #111;
      transform: rotate(4deg);
      font-size: 30px;
      font-weight: 900;
      line-height: 1.3;
    }
    .stamp {
      position: absolute;
      right: 36px;
      bottom: 42px;
      z-index: 3;
      background: #C9B8FF;
      border: 5px solid #111;
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.2;
      box-shadow: 6px 6px 0 #111;
      transform: rotate(-2deg);
    }
    .tools { width: 540px; margin: 18px auto 0; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p.lead { margin: 0 0 12px; font-size: 14px; line-height: 1.5; }
    form { margin: 0 0 12px; }
    input[type="text"] {
      font-family: inherit;
      font-size: 16px;
      border: 3px solid #111;
      border-radius: 10px;
      padding: 8px 10px;
      width: 280px;
      box-shadow: 3px 3px 0 #111;
      background: #fff;
    }
    button.btn {
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      border: 3px solid #111;
      border-radius: 10px;
      padding: 8px 14px;
      margin: 0 0 0 8px;
      background: #C8F542;
      box-shadow: 3px 3px 0 #111;
      cursor: pointer;
    }
    .seeds { margin: 0 0 14px; }
    button.seed {
      font-family: inherit;
      font-size: 13px;
      border: 3px solid #111;
      border-radius: 999px;
      padding: 4px 10px;
      margin: 0 8px 8px 0;
      background: #fff;
      box-shadow: 2px 2px 0 #111;
      cursor: pointer;
    }
    table { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; }
    th, td { border: 2px solid #111; padding: 4px 6px; text-align: left; vertical-align: top; }
    th { background: #F7F4EC; }
    .row2 { margin-top: 16px; }
    canvas.fig {
      background: #fff;
      border: 3px solid #111;
      box-shadow: 4px 4px 0 #111;
    }
    .cap { font-size: 13px; font-weight: 700; margin: 0 0 6px; }
    .canvases canvas { margin: 0 16px 0 0; vertical-align: top; }
    body.shot { width: 1080px; height: 1440px; overflow: hidden; }
    body.shot .page { padding: 0; }
    body.shot .fit { width: 1080px; height: 1440px; margin: 0; overflow: hidden; }
    body.shot .sheet { transform: none; }
    body.shot .tools { display: none; }
  </style>
</head>
<body>
  <div class="page">
    <div class="fit">
      <div class="sheet">
        <div class="card" id="card">
          <div class="tag">你可能不知道</div>
          <div class="dot"></div>
          <div class="sticker" id="panel"></div>
          <div class="name" id="meta"></div>
          <div class="stamp" id="code"></div>
        </div>
      </div>
    </div>
    <div class="tools">
      <h1>你可能不知道 · 形象预览</h1>
      <p class="lead" id="lead"></p>
      <form id="form" action="#">
        <input id="fp" type="text" autocomplete="off" spellcheck="false">
        <button class="btn" type="submit">换种子</button>
      </form>
      <div class="seeds" id="seeds"></div>
      <table id="dims"></table>
      <div class="row2 canvases">
        <div style="display:inline-block;margin-right:18px;">
          <p class="cap">canvas · drawFigure · 320</p>
          <canvas class="fig" id="c320" width="320" height="320"></canvas>
        </div>
        <div style="display:inline-block;">
          <p class="cap">128 边长仍能看见四肢</p>
          <canvas class="fig" id="c128" width="128" height="128"></canvas>
        </div>
      </div>
    </div>
  </div>
  <script src="js/fingerprint.js"></script>
  <script src="js/figure-avatar.js"></script>
  <script>
    (function () {
      var EXAMPLES = [
        'B665-6G14-RPME',
        '0000-0000-0000',
        '0708-0253-0243',
        '0509-0736-0305',
        '0401-0174-0474'
      ];
      function param(name) {
        var bag = String(window.location.search || '').replace(/^\?/, '');
        var hash = String(window.location.hash || '').replace(/^#/, '');
        var src = bag + '&' + hash;
        var parts = src.split('&');
        var i;
        for (i = 0; i < parts.length; i++) {
          var kv = parts[i].split('=');
          var k = kv[0] || '';
          try { k = decodeURIComponent(k); } catch (e) { k = kv[0]; }
          if (k === name) {
            var rest = kv.slice(1).join('=');
            try { return decodeURIComponent(rest.replace(/\+/g, ' ')); } catch (e2) { return rest; }
          }
        }
        return '';
      }
      function render(raw, rewrite) {
        var G = window.YKBD_FIGURE;
        var model = G.figureModel(raw);
        if (rewrite) document.getElementById('fp').value = model.fp;
        document.getElementById('code').textContent = model.fp;
        document.getElementById('meta').textContent = model.cardLine;
        document.getElementById('panel').innerHTML = G.figureSVG(model.fp, 500);
        paint('c320', model.fp, 320);
        paint('c128', model.fp, 128);
        try {
          if (param('shot') !== '1' && window.history && history.replaceState) {
            history.replaceState(null, '', '?fp=' + encodeURIComponent(model.fp));
          }
        } catch (err) {}
      }
      function paint(id, fp, size) {
        var c = document.getElementById(id);
        if (!c || !c.getContext) return;
        var ctx = c.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, c.width, c.height);
        drawFigure(ctx, fp, 0, 0, size);
      }
      function fillTools() {
        var G = window.YKBD_FIGURE;
        document.getElementById('lead').textContent = '组合数 ' + G.combo + '。地址栏可用 ?fp=XXXX-XXXX-XXXX ，本页不联网。白卡只放形象、部件名和指纹码。';
        var seeds = document.getElementById('seeds');
        var i;
        for (i = 0; i < EXAMPLES.length; i++) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'seed';
          b.setAttribute('data-fp', EXAMPLES[i]);
          b.textContent = EXAMPLES[i];
          seeds.appendChild(b);
        }
        seeds.onclick = function (ev) {
          var t = ev.target || ev.srcElement;
          if (t && t.getAttribute && t.getAttribute('data-fp')) render(t.getAttribute('data-fp'), true);
        };
        var table = document.getElementById('dims');
        var html = '<tr><th>维度</th><th>字符</th><th>选项</th></tr>';
        for (i = 0; i < G.dims.length; i++) {
          var d = G.dims[i];
          var names = [];
          var j;
          for (j = 0; j < d.options.length; j++) names.push(d.options[j].name);
          html += '<tr><td>' + d.label + '</td><td>' + d.chars + '</td><td>' + d.options.length + ' · ' + names.join('、') + '</td></tr>';
        }
        table.innerHTML = html;
      }
      document.getElementById('form').onsubmit = function (ev) {
        if (ev && ev.preventDefault) ev.preventDefault();
        render(document.getElementById('fp').value, true);
        return false;
      };
      if (param('shot') === '1') document.body.className = 'shot';
      fillTools();
      var initial = param('fp') || 'B665-6G14-RPME';
      document.getElementById('fp').value = initial;
      render(initial, true);
    })();
  </script>
</body>
</html>
