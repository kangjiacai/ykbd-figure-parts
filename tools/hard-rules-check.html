<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>hard rules</title>
</head>
<body>
  <canvas id="c" width="320" height="320"></canvas>
  <pre id="out">HARD_PENDING</pre>
  <script src="../js/fingerprint.js"></script>
  <script src="../js/figure-avatar.js"></script>
  <script>
    (function () {
      var fails = [];
      function fail(msg) { fails.push(msg); }
      window.onerror = function (msg) {
        document.getElementById('out').textContent = 'HARD_FAIL ' + msg;
      };
      function rng(seed) {
        var a = seed >>> 0;
        return function () {
          a = (a + 0x6D2B79F5) >>> 0;
          var t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function randCode(R) {
        var alpha = YKBD_F.ALPHA;
        var s = '';
        var i;
        for (i = 0; i < 12; i++) s += alpha.charAt(Math.floor(R() * alpha.length));
        return s.slice(0, 4) + '-' + s.slice(4, 8) + '-' + s.slice(8, 12);
      }
      function extremum(shapes, name, wantMax) {
        var found = -1;
        var i;
        for (i = 0; i < shapes.length; i++) {
          if (shapes[i].part !== name) continue;
          if (found < 0 || (wantMax && i > found) || (!wantMax && i < found)) found = i;
        }
        return found;
      }
      function hex(h) {
        return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
      }
      function near(px, rgb, tol) {
        return Math.abs(px[0] - rgb[0]) <= tol && Math.abs(px[1] - rgb[1]) <= tol && Math.abs(px[2] - rgb[2]) <= tol && px[3] > 180;
      }
      function bounds(sh) {
        var m = (sh.sw || 0) / 2;
        var box = { minx: 1e9, miny: 1e9, maxx: -1e9, maxy: -1e9 };
        function take(x, y) {
          if (x < box.minx) box.minx = x;
          if (y < box.miny) box.miny = y;
          if (x > box.maxx) box.maxx = x;
          if (y > box.maxy) box.maxy = y;
        }
        if (sh.op === 'circle') { take(sh.cx - sh.r, sh.cy - sh.r); take(sh.cx + sh.r, sh.cy + sh.r); }
        else if (sh.op === 'ellipse') { take(sh.cx - sh.rx, sh.cy - sh.ry); take(sh.cx + sh.rx, sh.cy + sh.ry); }
        else if (sh.op === 'roundrect') { take(sh.x, sh.y); take(sh.x + sh.w, sh.y + sh.h); }
        else if (sh.op === 'poly') {
          var p;
          for (p = 0; p < sh.pts.length; p++) take(sh.pts[p][0], sh.pts[p][1]);
        }
        box.minx -= m; box.miny -= m; box.maxx += m; box.maxy += m;
        return box;
      }
      var c = document.getElementById('c');
      var ctx = c.getContext('2d');
      var G = window.YKBD_FIGURE;
      var Z = G.zones;
      var hairRgb = hex(Z.hair);
      var codes = [];
      var R = rng(0xC0FFEE);
      var n;
      for (n = 0; n < 220; n++) codes.push(randCode(R));
      var h;
      for (h = 0; h < 12; h++) {
        codes.push(G.seedFor({ hair: h, eyes: 0, mouth: 0, body: h % 8, pose: h % 8, main: h % 8, accent: h % 8, accessory: h % 8 }));
      }
      codes.push('B665-6G14-RPME');
      codes.push('0000-0000-0000');
      codes.push('0708-0253-0243');
      codes.push('0509-0736-0305');
      codes.push('0401-0174-0474');
      var ci;
      for (ci = 0; ci < codes.length; ci++) {
        var code = codes[ci];
        var model = G.figureModel(code);
        var shapes = G.figureShapes(code);
        var lastBack = extremum(shapes, 'hairBack', true);
        var firstLeg = extremum(shapes, 'leg', false);
        var lastArm = extremum(shapes, 'arm', true);
        var firstNeck = extremum(shapes, 'neck', false);
        var firstHead = extremum(shapes, 'head', false);
        var firstFront = extremum(shapes, 'hairFront', false);
        var firstEye = extremum(shapes, 'eye', false);
        var firstEar = extremum(shapes, 'ear', false);
        var frontOk = firstFront < 0 || firstHead < firstFront;
        var faceOk = firstHead < firstEye && (firstFront < 0 || firstFront < firstEye);
        var earOk = firstEar < 0 || (firstNeck < firstEar && firstEar < firstEye && (firstFront < 0 || firstEar < firstFront));
        if (!(lastBack >= 0 && lastBack < firstLeg && firstLeg < lastArm && lastArm < firstNeck && firstNeck < firstHead && frontOk && faceOk && earOk)) {
          fail('order ' + code);
          break;
        }
        if (!model.hair.type) fail('undeclared ' + code);
        if (model.hair.type === 'bangs' && firstFront < 0) fail('missing bangs ' + code);
        var hands = 0;
        var shoes = 0;
        var si;
        for (si = 0; si < shapes.length; si++) {
          var sh = shapes[si];
          if (sh.part === 'hand') hands++;
          if (sh.part === 'shoe') shoes++;
          if (sh.part === 'arm' || sh.part === 'leg' || sh.part === 'hand' || sh.part === 'shoe') {
            var box = bounds(sh);
            if (box.minx < -0.5 || box.miny < -0.5 || box.maxx > 320.5 || box.maxy > 320.5) {
              fail('limb oob ' + code + ' ' + sh.part);
              break;
            }
          }
        }
        if (hands < 2 || shoes < 2) fail('limbs ' + code);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, 320, 320);
        drawFigure(ctx, code, 0, 0, 320);
        var ox = model.pose.ox || 0;
        var skin = hex(model.colors.skin);
        var neckHit = 0;
        var neckN = 0;
        var dx;
        var dy;
        var y;
        for (dx = -Z.neckHalf; dx <= Z.neckHalf; dx += Z.neckHalf) {
          for (dy = -4; dy <= 4; dy += 4) {
            neckN++;
            if (near(ctx.getImageData(Math.round(160 + ox + dx), Math.round(Z.neckY + dy), 1, 1).data, skin, 28)) neckHit++;
          }
        }
        var covHit = 0;
        var covN = 0;
        var depth = -1;
        var sx;
        for (y = Z.browY0; y <= Z.browY1; y += 4) {
          for (sx = -Z.browHalfX; sx <= Z.browHalfX; sx += 8) {
            covN++;
            if (near(ctx.getImageData(Math.round(160 + ox + sx), y, 1, 1).data, hairRgb, 36)) covHit++;
          }
        }
        for (y = 48; y <= Z.depthMax; y++) {
          if (near(ctx.getImageData(Math.round(160 + ox), y, 1, 1).data, hairRgb, 40)) depth = y;
        }
        var frontBottom = -1;
        var fi;
        for (fi = 0; fi < shapes.length; fi++) {
          if (shapes[fi].part !== 'hairFront') continue;
          var fb = bounds(shapes[fi]);
          if (fb.maxy > frontBottom) frontBottom = fb.maxy;
        }
        var cov = covN ? covHit / covN : 0;
        if (neckHit < neckN - 2) fail('neck ' + code + ' ' + model.hair.id + ' ' + model.body.id + ' ' + neckHit + '/' + neckN);
        if (model.hair.type === 'bangs') {
          if (cov < Z.bangsCoverage) fail('bangs cov ' + code + ' ' + model.hair.id + ' ' + covHit + '/' + covN);
          if (depth < Z.depthMin || depth > Z.depthMax) fail('bangs depth ' + code + ' ' + model.hair.id + ' ' + depth);
        }
        if ((model.hair.type === 'short' || model.hair.type === 'crop') && frontBottom > Z.eyeY - 4) {
          fail('short over eye ' + code + ' ' + model.hair.id + ' ' + frontBottom);
        }
        if (model.hair.type === 'crop' && cov > Z.cropCoverage) {
          fail('crop covered ' + code + ' ' + model.hair.id + ' ' + covHit + '/' + covN);
        }
        if (fails.length > 8) break;
      }
      var summary = fails.length ? ('HARD_FAIL ' + fails.join(' | ')) : ('HARD_OK ' + codes.length);
      document.getElementById('out').textContent = summary;
    })();
  </script>
</body>
</html>
