<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>sheet</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #E6E8EC; font-family: "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif; }
    h2 { margin: 12px 8px 4px; font-size: 14px; }
    .row { white-space: nowrap; }
    .cell { display: inline-block; width: 110px; margin: 4px; vertical-align: top; background: #D9CCFF; border: 3px solid #000; }
    .cell svg { width: 104px; height: 104px; display: block; }
    .cell span { display: block; font-size: 11px; text-align: center; background: #fff; padding: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="../js/fingerprint.js"></script>
  <script src="../js/figure-avatar.js"></script>
  <script>
    (function () {
      var G = window.YKBD_FIGURE;
      var root = document.getElementById('root');
      function addRow(title, key) {
        var h = document.createElement('h2');
        h.textContent = title;
        root.appendChild(h);
        var row = document.createElement('div');
        row.className = 'row';
        var dim;
        var i;
        for (i = 0; i < G.dims.length; i++) if (G.dims[i].key === key) dim = G.dims[i];
        for (i = 0; i < dim.options.length; i++) {
          var idx = { hair: 0, eyes: 0, mouth: 1, body: 0, pose: 0, main: 0, accent: 4, accessory: 0 };
          idx[key] = i;
          var cell = document.createElement('div');
          cell.className = 'cell';
          cell.innerHTML = G.figureSVG(G.seedFor(idx), 104);
          var cap = document.createElement('span');
          cap.textContent = dim.options[i].name;
          cell.appendChild(cap);
          row.appendChild(cell);
        }
        root.appendChild(row);
      }
      addRow('发型', 'hair');
      addRow('眼睛', 'eyes');
      addRow('嘴', 'mouth');
      addRow('衣服', 'body');
      addRow('姿势', 'pose');
      addRow('配件', 'accessory');
    })();
  </script>
</body>
</html>
